<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Institutional midnight canvas -->
  <rect width="100" height="100" rx="20" fill="#07090e"/>
  <rect width="98" height="98" x="1" y="1" rx="19" stroke="#1e293b" stroke-width="1.2"/>
  
  <defs>
    <linearGradient id="silverArc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
  </defs>

  <!-- Monogramme S : Deux arcs géométriques purs (Cycle Perception / Action) -->
  <g transform="translate(50, 50)">
    <!-- Arc Supérieur : Perception (Évaluation de situation) -->
    <path 
      d="M12 -28 C-12 -28 -24 -16 -24 -2 C-24 10 -12 16 0 16" 
      stroke="url(#silverArc)" 
      stroke-width="7" 
      stroke-linecap="round"
    />
    
    <!-- Arc Inférieur : Action (Décision bornée) -->
    <path 
      d="M0 -16 C12 -16 24 -10 24 2 C24 16 12 28 -12 28" 
      stroke="url(#silverArc)" 
      stroke-width="7" 
      stroke-linecap="round"
    />

    <!-- Point de repère central (Pondération) -->
    <circle cx="0" cy="0" r="2.5" fill="#38bdf8"/>
  </g>
</svg>
