<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1584 396" fill="none">
  <defs>
    <linearGradient id="bannerBg" x1="0" y1="0" x2="1584" y2="396">
      <stop offset="0%" stop-color="#04060a"/>
      <stop offset="50%" stop-color="#080b12"/>
      <stop offset="100%" stop-color="#04060a"/>
    </linearGradient>
    <radialGradient id="bannerAura" cx="55%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#94a3b8" stop-opacity="0.08"/>
      <stop offset="40%" stop-color="#38bdf8" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&amp;family=JetBrains+Mono:wght@500&amp;display=swap');
    .wordmark {
      font-family: 'Cinzel', 'Times New Roman', serif;
      font-weight: 700;
      fill: #f8fafc;
      font-size: 68px;
      letter-spacing: 0.26em;
    }
    .domain {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 500;
      fill: #64748b;
      font-size: 13px;
      letter-spacing: 0.45em;
    }
  </style>

  <!-- Background Base -->
  <rect width="1584" height="396" fill="url(#bannerBg)"/>
  <ellipse cx="870" cy="198" rx="600" ry="190" fill="url(#bannerAura)"/>

  <!-- Engineering Grid -->
  <g stroke="#1e293b" stroke-width="0.5" stroke-opacity="0.3">
    <line x1="0" y1="99" x2="1584" y2="99"/>
    <line x1="0" y1="198" x2="1584" y2="198"/>
    <line x1="0" y1="297" x2="1584" y2="297"/>
    <line x1="396" y1="0" x2="396" y2="396"/>
    <line x1="792" y1="0" x2="792" y2="396"/>
    <line x1="1188" y1="0" x2="1188" y2="396"/>
  </g>

  <!-- Concentric Engineering Rings (Right-leaning focal balance) -->
  <circle cx="870" cy="198" r="170" stroke="#334155" stroke-width="1.2" stroke-dasharray="6 8" stroke-opacity="0.35"/>
  <circle cx="870" cy="198" r="140" stroke="#1e293b" stroke-width="1" stroke-opacity="0.5"/>

  <!-- Fine Vector Horizon Lines -->
  <line x1="450" y1="198" x2="620" y2="198" stroke="#475569" stroke-width="1" stroke-opacity="0.4"/>
  <circle cx="620" cy="198" r="3" fill="#38bdf8"/>

  <line x1="1120" y1="198" x2="1290" y2="198" stroke="#475569" stroke-width="1" stroke-opacity="0.4"/>
  <circle cx="1120" cy="198" r="3" fill="#38bdf8"/>

  <!-- Center Stage: Wordmark & Subline -->
  <!-- Note: Offset slightly right (cx=870) to allow avatar safe room on left on LinkedIn -->
  <g transform="translate(870, 205)">
    <text x="0" y="0" text-anchor="middle" class="wordmark">SENTIANIS</text>
    <text x="0" y="44" text-anchor="middle" class="domain">SENTIANIS.COM</text>
  </g>
</svg>
